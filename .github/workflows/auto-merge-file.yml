# auto-merge-file.yml — intègre dans `main` les branches `claude/*` poussées par Runner A.
#
# Pourquoi ce workflow existe. Runner A tourne dans une session cloud dont le proxy GitHub
# n'autorise le push que sur sa propre branche `claude/*` : il ne peut pas écrire sur `main`,
# que Runner B lit. Sans intégration automatique, chaque run finit par « quelqu'un doit merger
# à la main » — et le pipe ne tourne plus tout seul (constaté les 06 et 07/09/2026).
#
# Ce workflow s'exécute dans le dépôt avec les droits du dépôt : le GITHUB_TOKEN de l'exécution
# suffit à pousser sur `main`, aucun PAT nécessaire.
#
# Il est délibérément étroit : il n'intègre QUE des fichiers de la file. Une branche `claude/*`
# qui touche autre chose est refusée, jamais mergée en silence — c'est ce qui empêche une
# session compromise ou distraite de pousser du code sur `main` par ce chemin.
#
# Toute la logique non triviale vit dans `.github/scripts/` : du Python multi-ligne inséré
# directement dans un bloc `run:` casse le fichier de workflow, et un script se teste en local.

name: auto-merge-file

on:
  push:
    branches:
      - 'claude/**'
  workflow_dispatch:
    inputs:
      branche:
        description: 'Branche claude/* à intégrer'
        required: true

permissions:
  contents: write

concurrency:
  group: auto-merge-file
  cancel-in-progress: false

jobs:
  merger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Identifier la branche à intégrer
        id: br
        env:
          ENTREE: ${{ github.event.inputs.branche }}
          REF: ${{ github.ref_name }}
        run: |
          BR="${ENTREE:-$REF}"
          case "$BR" in
            claude/*) ;;
            *) echo "REFUS : « $BR » n'est pas une branche claude/*"; exit 1 ;;
          esac
          git fetch origin "$BR:refs/remotes/origin/$BR"
          echo "nom=$BR" >> "$GITHUB_OUTPUT"

      - name: Garde-fou 1 - rien hors de la file
        env:
          BR: ${{ steps.br.outputs.nom }}
        run: |
          HORS=$(git diff --name-only "origin/main...origin/$BR" -- ':!file')
          if [ -n "$HORS" ]; then
            echo "REFUS : cette branche touche des fichiers hors file/ :"
            echo "$HORS"
            echo "Un changement de code s'intègre par une PR relue, pas par ce chemin."
            exit 1
          fi
          echo "OK : seuls des fichiers de file/ ont changé."

      - name: Garde-fou 2 - chaque item est un item de file valide
        env:
          BR: ${{ steps.br.outputs.nom }}
        run: |
          mkdir -p /tmp/items
          LISTE=""
          for f in $(git diff --name-only --diff-filter=d "origin/main...origin/$BR" -- file); do
            case "$f" in *.json) ;; *) continue ;; esac
            git show "origin/$BR:$f" > "/tmp/items/$(basename "$f")"
            LISTE="$LISTE /tmp/items/$(basename "$f")"
          done
          if [ -z "$LISTE" ]; then echo "Aucun item ajouté ou modifié."; exit 0; fi
          python3 .github/scripts/valider_items.py $LISTE

      - name: Merger et pousser
        env:
          BR: ${{ steps.br.outputs.nom }}
        run: |
          if git merge-base --is-ancestor "origin/$BR" origin/main; then
            echo "Déjà intégrée, rien à faire."
            exit 0
          fi
          git config user.name  "histoviz-bot"
          git config user.email "actions@users.noreply.github.com"
          git merge --no-ff "origin/$BR" -m "auto-merge: $BR (file)"
          git push origin main
          echo "Intégrée : $BR"

      - name: Retirer la branche intégrée
        if: success()
        continue-on-error: true
        env:
          BR: ${{ steps.br.outputs.nom }}
        run: git push origin --delete "$BR"
