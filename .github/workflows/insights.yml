# insights.yml — pull hebdomadaire des insights IG → stats.json dans stathisto
#
# À placer dans le repo Koroscalista/histoviz-media, chemin .github/workflows/insights.yml.
# Ce N'EST PAS un workflow de ce dépôt-ci (stathisto) : il vit côté histoviz-media, là où le
# secret IG_ACCESS_TOKEN existe déjà (comme publish.yml / Runner B). Ce fichier-ci en est la
# COPIE DE RÉFÉRENCE, versionnée avec le script qu'elle appelle ; l'original tourne là-bas.
#
# Il checkoute les DEUX dépôts :
#   - histoviz-media (lui-même) pour `file/`, la file de publication — c'est elle qui porte
#     les media_id et le pilier, et elle ne vit PAS dans stathisto ;
#   - stathisto pour le script et les bundles (hook, source), et c'est là qu'il recommite.
#
# Frontière de sécurité (docs/master-onboarding.md §6) : le token ne quitte jamais Actions —
# il est passé en env au seul step du pull, jamais loggé, jamais écrit.
#
# Secrets attendus (posés côté histoviz-media, vérifiés le 04/09/2026) :
#   - IG_ACCESS_TOKEN : token Instagram Login longue durée. Permission requise :
#     `instagram_business_manage_insights` (nom du flux Instagram Login — PAS
#     `instagram_manage_insights`, qui est le nom Facebook Login).
#   - GH_PAT_SECRETS  : PAT avec write sur Koroscalista/StatHisto (write-back stats.json)

name: insights-hebdo

on:
  schedule:
    - cron: "0 6 * * 1"          # tous les lundis 06:00 UTC — avant le bilan local
  workflow_dispatch:              # déclenchable à la main pour tester

permissions:
  contents: read                  # l'écriture sur stathisto passe par le PAT, pas par GITHUB_TOKEN

concurrency:
  group: insights-hebdo
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout histoviz-media (la file de publication vit ici)
        uses: actions/checkout@v4
        with:
          path: media

      - name: Checkout stathisto (le script + les bundles vivent là)
        uses: actions/checkout@v4
        with:
          repository: Koroscalista/StatHisto
          token: ${{ secrets.GH_PAT_SECRETS }}
          path: stathisto

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull des insights (déterministe, stdlib — le token reste dans ce step)
        working-directory: stathisto
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python3 tools/perf_pull.py --file ../media/file

      - name: Write-back stats.json + history.jsonl dans stathisto
        working-directory: stathisto
        run: |
          git config user.name  "histoviz-insights-bot"
          git config user.email "insights@users.noreply.github.com"
          if git diff --quiet -- pipeline/perf; then
            echo "Aucun changement d'insights — rien à committer."
            exit 0
          fi
          git add pipeline/perf/stats.json pipeline/perf/history.jsonl
          git commit -m "perf: pull insights $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
