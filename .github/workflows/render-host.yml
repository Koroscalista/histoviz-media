# render-host.yml — rend les items `prêt`, héberge le MP4, et les fait passer à `produit`.
#
# Pourquoi ici et pas dans Runner A. La session cloud de Runner A sait rendre une vidéo, mais son
# proxy GitHub lui refuse la création de Releases (403, accès limité aux opérations de revue de
# PR). Un MP4 rendu dans ce conteneur est donc perdu avec lui : aucun item ne peut atteindre
# `programmé`, et rien ne se publie. Constaté les 06, 07 et 08/09/2026.
#
# Ce workflow s'exécute dans le dépôt : le GITHUB_TOKEN de l'exécution crée les Releases de ce
# dépôt et pousse sur `main` sans PAT. Le PAT (GH_PAT_SECRETS) ne sert qu'à cloner le moteur.
#
# Toute la logique non triviale vit dans `.github/scripts/` — du Python multi-ligne dans un
# bloc `run:` casse le fichier de workflow, et un script se teste en local.

name: render-host

on:
  workflow_run:
    workflows: [auto-merge-file]
    types: [completed]
  schedule:
    - cron: '25 * * * *'
  workflow_dispatch:
    inputs:
      slug:
        description: 'Ne traiter que ce slug (vide = tous les items prêts)'
        required: false

permissions:
  contents: write

concurrency:
  group: render-host
  cancel-in-progress: false

jobs:
  rendre:
    runs-on: ubuntu-latest
    steps:
      # La file et le moteur doivent être FRÈRES : etats.dossier_file() cherche
      # « histoviz-media/file » chez un ancêtre, et c'est comme ça qu'il la trouve.
      - name: Checkout du dépôt de publication
        uses: actions/checkout@v4
        with:
          path: histoviz-media
          ref: main

      - name: Checkout du moteur
        uses: actions/checkout@v4
        with:
          repository: Koroscalista/StatHisto
          token: ${{ secrets.GH_PAT_SECRETS }}
          path: stathisto
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dépendances
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python3 -m pip install --quiet playwright pillow shapely openpyxl
          python3 -m playwright install --with-deps chromium

      - name: Que faut-il rendre ?
        id: quoi
        working-directory: stathisto
        env:
          SLUG: ${{ github.event.inputs.slug }}
        run: |
          if [ -n "$SLUG" ]; then
            python3 ../histoviz-media/.github/scripts/file_selection.py --slug "$SLUG" >> "$GITHUB_OUTPUT"
          else
            python3 ../histoviz-media/.github/scripts/file_selection.py >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

      - name: Rendre, héberger, avancer
        if: steps.quoi.outputs.slugs != '[]'
        working-directory: stathisto
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FILE_DIR: ${{ steps.quoi.outputs.file_dir }}
          SLUGS: ${{ steps.quoi.outputs.slugs }}
          DEPOT: Koroscalista/histoviz-media
        run: |
          set -uo pipefail
          for slug in $(echo "$SLUGS" | tr -d '[]"' | tr ',' ' '); do
            [ -n "$slug" ] || continue
            echo "::group::$slug"
            bundle="filler/productions/$slug/sujet.json"
            if [ ! -f "$bundle" ]; then
              echo "bundle absent — item laissé en prêt"; echo "::endgroup::"; continue
            fi
            typ=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1])).get('type') or '')" "$bundle")
            # Les gros CSV sources ne sont pas versionnés (choix documenté du .gitignore) : dans
            # un dépôt fraîchement cloné, `build.py` échoue faute de CSV alors que `data.json`,
            # lui, est là. Il suffit alors de régénérer `data.js`, simple enveloppe du data.json.
            if ! python3 filler/build.py "$bundle"; then
              echo "build impossible (source absente ?) — repli sur le data.json versionné"
              python3 tools/data_js.py "$slug" \
                || { echo "ni build ni data.json — item laissé en prêt"; echo "::endgroup::"; continue; }
            fi
            python3 tools/rendre.py "filler/templates/$typ/chart.html" \
                    --slug "$slug" --video --out "$slug.mp4" \
              || { echo "rendu KO"; echo "::endgroup::"; continue; }
            # Le rendu sort un MP4 MUET — c'est le contrat du socle. La musique est une passe
            # distincte (socle/musique.py choisit, socle/mux.py muxe). Sans elle on héberge du
            # muet : c'est ce qui a envoyé le reel « Iran vs Israel » sans son le 09/09/2026.
            final=$(python3 ../histoviz-media/.github/scripts/muxer.py --moteur . --slug "$slug") \
              || { echo "mux KO — item laissé en prêt"; echo "::endgroup::"; continue; }
            # L'asset hébergé porte toujours <slug>.mp4 : c'est l'URL que la file référence.
            mp4="$RUNNER_TEMP/$slug.mp4"
            cp "$final" "$mp4"
            duree=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$mp4")
            url="https://github.com/$DEPOT/releases/download/$slug/$slug.mp4"
            # 1. la durée décide AVANT l'hébergement : pas de Release pour une vidéo hors fenêtre
            if ! python3 ../histoviz-media/.github/scripts/marquer_produit.py --verifier \
                   --file-dir "$FILE_DIR" --slug "$slug" --duree "$duree" --url "$url"; then
              echo "::endgroup::"; continue
            fi
            # 2. héberger
            if ! gh release create "$slug" "$mp4" --repo "$DEPOT" --title "$slug" --notes "MP4 de $slug"; then
              gh release upload "$slug" "$mp4" --repo "$DEPOT" --clobber \
                || { echo "hébergement KO — item laissé en prêt"; echo "::endgroup::"; continue; }
            fi
            # 3. et seulement là, écrire l'URL dans l'item
            python3 ../histoviz-media/.github/scripts/marquer_produit.py \
                    --file-dir "$FILE_DIR" --slug "$slug" --duree "$duree" --url "$url"
            echo "::endgroup::"
          done

      - name: Committer la file
        working-directory: histoviz-media
        run: |
          if [ -n "$(git status --porcelain -- ':!file')" ]; then
            echo "STOP : des fichiers hors file/ ont bougé"; exit 1
          fi
          if [ -z "$(git status --porcelain -- file)" ]; then
            echo "Rien à commiter."; exit 0
          fi
          git config user.name  "histoviz-bot"
          git config user.email "actions@users.noreply.github.com"
          git add file/
          git commit -m "render-host: $(date -u +%FT%TZ)"
          git pull --rebase
          git push
